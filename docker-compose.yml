services:
  backend-api:
    image: sportsfacility-api:latest
    build:
      context: .
      dockerfile: Backend/SportsFacility.API/Dockerfile
    ports:
      - "5228:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

  frontend-ui:
    image: sportsfacility-frontend:latest
    build:
      context: .
      dockerfile: frontend/SportsFacility.Frontend/Dockerfile
    ports:
      - "5185:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - backend-api
